# A release is a tag vX.Y.Z on main of the public mirror, placed by the owner's
# word; the number must equal the workspace version in Cargo.toml — one number,
# one source (D-068). The same tests, the same image pushed as X.Y.Z and latest,
# plus the GitHub Release whose notes list the export commits since the previous
# tag (edited by hand afterwards).
name: release

on:
  push:
    tags: [v*]

permissions:
  contents: write
  packages: write

jobs:
  number:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match the workspace version $version in Cargo.toml" >&2
            exit 1
          fi

  tests:
    needs: number
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV" # ghcr names are lowercase
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}" # colons are not allowed in artifact paths
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)

  release:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes reach back to the previous tag
      - name: The release notes from the export commits
        run: |
          tag="$GITHUB_REF_NAME"
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            git log --format='- %s' "$prev..$tag"
          else
            git log --format='- %s' "$tag"
          fi > notes.md
          gh release create "$tag" --title "Prostor $tag" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
