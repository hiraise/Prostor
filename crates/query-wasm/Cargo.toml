[package]
name = "prostor-query-wasm"
description = "The browser's copy of the query language: tokens, problems and the canonical text over linear memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prostor-query.workspace = true
serde.workspace = true
serde_json.workspace = true

# The workspace lints, except that the three exports over linear memory need `unsafe`: it is
# denied here and allowed only on them (D-038).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
