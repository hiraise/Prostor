# The small server of the performance budget (architecture.md §7, D-032) for `make bench`: the
# PostgreSQL part of 2 vCPU / 4 GB that a team of up to 50 people runs, with trackflow beside it.
# Port 5450 on loopback (BENCH_PORT of `make bench` changes it). `make bench` stops it after each run; the dataset stays in the volume.
name: trackflow-bench

services:
  postgres:
    image: postgres:18.6-alpine
    command:
      - postgres
      # The target dataset (about 0.5 GB) is held in PostgreSQL's own buffers: in Docker Desktop
      # the container's file cache fills with the WAL of the bulk load and stops holding tables.
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      # SSD storage: random reads cost little more than sequential ones.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # Room for the bulk load of the dataset without a checkpoint every few seconds.
      - -c
      - max_wal_size=2GB
      # Compiling plans to machine code costs tens of milliseconds on short queries.
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - track_io_timing=on
    cpus: 2
    # What is left of 4 GB after trackflow and the system.
    mem_limit: 3g
    stop_grace_period: 1m
    # Parallel queries share memory through /dev/shm; Docker gives 64 MB by default.
    shm_size: 256m
    environment:
      POSTGRES_USER: trackflow
      POSTGRES_PASSWORD: trackflow
      POSTGRES_DB: trackflow_bench
    ports:
      - "127.0.0.1:${TRACKFLOW_BENCH_PORT:-5450}:5432"
    volumes:
      - benchdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackflow -d trackflow_bench"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2m
      start_interval: 2s

volumes:
  benchdata:
