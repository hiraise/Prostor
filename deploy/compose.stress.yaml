# The stress run of the performance budget (architecture.md §7, D-032) for `make bench-stress`:
# 1M issues on PostgreSQL limited to 4 CPUs and 8 GB, configured for that size. Port 5435 on
# loopback; its own volume, so the target dataset of `make bench` survives it.
name: trackflow-stress

services:
  postgres:
    image: postgres:18.6-alpine
    command:
      - postgres
      # The whole reference dataset (about 4 GB) is in memory, as on the 8 GB server. It is held in
      # PostgreSQL's own buffers: in Docker Desktop the container's file cache fills with the WAL of
      # the bulk load and stops holding tables, which would measure the disk of the VM instead.
      - -c
      - shared_buffers=5GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      # SSD storage: random reads cost little more than sequential ones.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # Room for the bulk load of the dataset without a checkpoint every few seconds.
      - -c
      - max_wal_size=8GB
      # Compiling plans to machine code costs tens of milliseconds on short queries.
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - track_io_timing=on
    cpus: 4
    mem_limit: 8g
    # Stopping writes gigabytes of buffers to disk; a killed server replays its WAL on start.
    stop_grace_period: 2m
    # Parallel queries share memory through /dev/shm; Docker gives 64 MB by default.
    shm_size: 1g
    environment:
      POSTGRES_USER: trackflow
      POSTGRES_PASSWORD: trackflow
      POSTGRES_DB: trackflow_stress
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - stressdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackflow -d trackflow_stress"]
      interval: 2s
      timeout: 3s
      retries: 30
      # Time for a recovery after an unclean stop.
      start_period: 10m
      start_interval: 2s

volumes:
  stressdata:
