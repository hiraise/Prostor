<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>TaskMaster</title>
    <!--
      Shown only if the app has not started after a few seconds: a browser too old to run it
      (UI-035) or JavaScript turned off. The app removes it once it starts. Static text, so both
      languages are here.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font:
          15px/1.5 system-ui,
          sans-serif;
        text-align: center;
        /* Hidden (also from screen readers) unless the app is still missing after 4 s. */
        visibility: hidden;
        animation: boot-show 0s 4s forwards;
      }
      @keyframes boot-show {
        to {
          visibility: visible;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot">
      <div>
        <p>
          TaskMaster cannot start in this browser. Use a recent Chrome, Edge, Firefox, Opera or
          Safari, with JavaScript on.
        </p>
        <p lang="ru">
          TaskMaster не может запуститься в этом браузере. Откройте его в свежей версии Chrome,
          Edge, Firefox, Opera или Safari с включённым JavaScript.
        </p>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
